# Test-only settings. Tests run with profile "local", which also reads the developer's own
# src/main/resources/application-local.properties, and that file may hold a real Gemini key. Spring Boot reads
# classpath:/config/ after classpath:/, so the blanks below win in every test: no test calls the internet (CLAUDE.md),
# and the media scan runs as without a key (a test that needs a reader replaces MediaReader with a mock).
app.moderation.gemini.api-key=
app.moderation.dev-media-text=
