# Test-only settings. Tests run with profile "local", which also reads the developer's own
# src/main/resources/application-local.properties, and that file may hold a real Gemini key. Spring Boot reads
# classpath:/config/ after classpath:/, so the blanks below win in every test: no test calls the internet (CLAUDE.md),
# and the media scan runs as without a key (a test that needs a reader replaces MediaReader with a mock).
app.moderation.gemini.api-key=
app.moderation.dev-media-text=
# Media files of tests stay in a local folder, even when the developer's own file switches to Cloudflare R2.
app.media.storage=local
app.media.r2.import-from=
# The chat e-mail digest (feature/chat/notify) waits an hour after a test context starts, so it never sends e-mails
# while other test classes run; NotifyFlowTest calls the job itself.
app.chat.notify.email-initial-delay-ms=3600000
# Tests always run on their own local databases (asvsj_test, asvsj_faq_test_…), so Flyway creates and updates them
# there, whatever the shared application.properties says for the app itself (it may be off for a shared server DB).
spring.flyway.enabled=true
# "Nhiệm vụ hằng ngày": the default spacing of counted flash card answers, whatever a developer's own file sets (0 for
# tapping on an emulator), and the test-only API off unless a test turns it on.
app.quests.min-answer-interval-ms=1500
app.quests.dev-api.enabled=false
