<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm kiếm – Senpai ơi</title>
    <meta name="description" content="Tìm địa điểm, bài viết, câu hỏi, cẩm nang, sự kiện và mẫu câu tiếng Nhật trên Senpai ơi.">
    <link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#C2456E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/site.css">
    <link rel="stylesheet" href="/assets/css/search.css">
</head>
<body class="app">
<!-- "Tìm kiếm" (the prototype's "Tìm kiếm chung", reached from the Home): one text searched in places, posts,
     questions, guides, events, phrases and FAQ entries; each part shows its first 5 and links to its own page. -->
<main class="page narrow searchpage" id="search-page">
    <div>
        <a class="link" href="/"><span class="ic" aria-hidden="true">chevron_left</span>Trang chủ</a>
        <h2>Tìm kiếm</h2>
    </div>
    <form class="site-search" id="search" role="search" action="/search" method="get">
        <span class="ic" aria-hidden="true">search</span>
        <label class="sr-only" for="q">Tìm trên Senpai ơi</label>
        <input id="q" name="q" type="search" maxlength="100" autocomplete="off" enterkeyhint="search"
               placeholder="Tìm địa điểm, bài viết, sự kiện…">
        <button class="btn pri sm" type="submit">Tìm</button>
    </form>
    <p class="note" id="summary" aria-live="polite">Đang tải…</p>
    <nav class="res-jump" id="jump" aria-label="Nhóm kết quả" hidden></nav>
    <p class="alert error" id="failure" role="alert" hidden></p>
    <div class="res-results" id="results"></div>
</main>
<script type="module" src="/assets/js/pages/search.js"></script>
</body>
</html>
