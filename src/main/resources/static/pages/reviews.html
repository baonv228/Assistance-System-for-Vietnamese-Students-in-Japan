<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review mới – Senpai ơi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/site.css">
    <link rel="stylesheet" href="/assets/css/blog.css">
    <link rel="stylesheet" href="/assets/css/reviews.css">
</head>
<body class="app">
<!-- "Review mới" ("Tất cả" on the Home card "Review mới quanh …"): every review of a place by other people, newest
     first, around the user's area, in their prefecture or everywhere. Each one opens its place on the Map. -->
<main class="page narrow reviewspage" id="reviews">
    <div>
        <a class="link" href="/"><span class="ic" aria-hidden="true">chevron_left</span>Trang chủ</a>
        <h2>Review mới</h2>
        <p class="note" id="summary" aria-live="polite">Đang tải…</p>
    </div>
    <div class="seg" id="scopes" role="group" aria-label="Phạm vi" hidden></div>
    <div class="rv-list" id="list"></div>
    <p class="alert error" id="failure" role="alert" hidden></p>
    <p><button class="btn sm" type="button" id="more" hidden>Xem thêm review</button></p>
</main>
<script type="module" src="/assets/js/pages/reviews.js"></script>
</body>
</html>
