<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderator – Senpai ơi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">

<!-- Only signed-in MODERATOR accounts can open this page (SecurityConfig) -->
<body class="app" data-role="MODERATOR">
<template id="guide-content"><div class="guide-page">
<a id="dashboard" href="/moderator" hidden>← Dashboard Moderator</a>
<header class="page-heading"><h1>Cẩm nang sinh viên</h1><p>Hướng dẫn theo chủ đề dành cho sinh viên Việt Nam tại Nhật Bản.</p><button class="btn pri" id="create" hidden>Tạo cẩm nang</button></header>
<p id="message" role="status" aria-live="polite"></p>
<section id="listing"><form id="filters" class="guide-filters card"><label>Tìm kiếm<input name="q" maxlength="200" placeholder="Tiêu đề hoặc mô tả"></label><label>Chủ đề<select name="category"><option value="">Tất cả chủ đề</option></select></label><button class="btn">Tìm kiếm</button></form><p id="count"></p><div id="guide-list" class="list"></div></section>
<section id="editor" hidden><h2>Tạo cẩm nang</h2><form id="guide-form"><label>Tiêu đề *<input name="title" required maxlength="255"></label><label>Mô tả mục đích, đối tượng áp dụng *<textarea name="summary" required maxlength="2000"></textarea></label><label>Chủ đề *<select name="category" required><option value="">Chọn chủ đề</option></select></label><h3>Nội dung hướng dẫn</h3><div id="sections"></div><button class="btn" type="button" id="add-section">Thêm mục hướng dẫn</button><div class="guide-actions"><button class="btn" type="button" id="cancel">Hủy</button><button class="btn" type="submit">Xem lại bản nháp</button></div></form></section>
<section id="detail" hidden></section>
</div></template>
<script type="module" src="/assets/js/pages/guides.js"></script>
</body>
</html>
