<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo – Senpai ơi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">

<body class="app">
<!-- "Thông báo" (the bell in the header): results of the photo/video scan of the user's posts, questions and reviews,
     comments and best answers. Opening the page marks them read. -->
<main class="page narrow notifpage" id="notifications">
    <div>
        <a class="link" href="/profile"><span class="ic" aria-hidden="true">chevron_left</span>Tôi</a>
        <h2>Thông báo</h2>
        <p class="note" id="summary" aria-live="polite">Đang tải…</p>
    </div>
    <ul class="notif-list" id="list"></ul>
    <p><button class="btn sm" type="button" id="more" hidden>Xem thêm</button></p>
</main>
<script type="module" src="/assets/js/pages/notifications.js"></script>
</body>
