<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viết review – Senpai ơi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/site.css">
    <link rel="stylesheet" href="/assets/css/blog.css">
    <link rel="stylesheet" href="/assets/css/blog-detail.css">
    <link rel="stylesheet" href="/assets/css/blog-write.css">
    <link rel="stylesheet" href="/assets/css/events.css">
</head>
<body class="app">
<!-- "Viết review" for an event (/events/{id}/review): writes the viewer's review of this year, or edits it -->
<main class="page narrow write-page">
    <a class="link back" id="back" href="/events"><span class="ic" aria-hidden="true">arrow_back</span>Quay lại</a>

    <div id="gate" aria-live="polite"><p class="note">Đang tải…</p></div>

    <form class="write-form" id="form" method="post" novalidate hidden>
        <header class="write-head">
            <h1 id="page-title">Viết review</h1>
            <h2 id="event-title"></h2>
            <p class="note" id="event-sub"></p>
        </header>

        <p class="alert quota" id="quota" hidden></p>
        <div class="alert error" id="form-error" role="alert" tabindex="-1" hidden></div>

        <section class="card write-card" aria-label="Review">
            <fieldset class="field" data-field="rating">
                <legend>Đánh giá <span class="req" aria-hidden="true">*</span></legend>
                <div class="star-pick" id="stars" role="radiogroup" aria-label="Số sao"></div>
                <p class="field-error" id="rating-error" hidden></p>
            </fieldset>

            <div class="field" data-field="content">
                <label for="content">Nội dung <span class="req" aria-hidden="true">*</span></label>
                <textarea class="input short" id="content" name="content" rows="6" maxlength="2000"
                          placeholder="Không khí, chi phí, nên đi giờ nào" aria-describedby="content-error link-note content-count"></textarea>
                <div class="row hint">
                    <p class="note" id="link-note"></p>
                    <span class="grow"></span>
                    <span class="note counter" id="content-count" aria-live="polite">0/2000</span>
                </div>
                <p class="field-error" id="content-error" hidden></p>
            </div>

            <ul class="media-picks" id="media-picks" aria-label="Ảnh và video đã chọn" hidden></ul>
            <div class="row">
                <button class="btn" type="button" id="add-image"><span class="ic" aria-hidden="true">photo_camera</span>Thêm ảnh <span class="note" id="images-count">0/5</span></button>
                <button class="btn" type="button" id="add-video"><span class="ic" aria-hidden="true">videocam</span>Thêm video (tối đa 30 giây)</button>
                <input class="sr-only" type="file" id="image-input" tabindex="-1" aria-hidden="true" multiple
                       accept="image/jpeg,image/png,image/heic,image/heif,.jpg,.jpeg,.png,.heic,.heif">
                <input class="sr-only" type="file" id="video-input" tabindex="-1" aria-hidden="true"
                       accept="video/mp4,video/quicktime,.mp4,.mov">
            </div>
            <p class="note" id="video-note" hidden></p>
            <p class="field-error" id="images-error" data-field="images" hidden></p>
            <p class="field-error" id="video-error" data-field="video" hidden></p>

            <button class="btn pri" type="submit" id="submit"><span class="ic" aria-hidden="true">send</span><span id="submit-label">Đăng review</span></button>
            <p class="note"><span class="ic" aria-hidden="true">shield</span>Chữ được lọc từ khóa ngay. Ảnh và video được quét sau khi đăng; trong lúc đó review ở trạng thái “đang xử lý” và chỉ bạn thấy.</p>
        </section>
    </form>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/assets/js/pages/event-review.js"></script>
</body>
</html>
