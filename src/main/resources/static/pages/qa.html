<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỏi-Đáp – Senpai ơi</title>
    <meta name="description" content="Hỏi-Đáp cho du học sinh Việt tại Nhật: đặt câu hỏi, nhận câu trả lời từ các senpai đi trước và xem các câu hỏi thường gặp.">
    <link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#C2456E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/site.css">
    <link rel="stylesheet" href="/assets/css/blog.css">
    <link rel="stylesheet" href="/assets/css/qa.css">
</head>
<body class="app">
<!-- Hỏi-Đáp, two tabs: questions of the community and their answers (opened on qa-detail.html, asked on qa-ask.html),
     and "Câu hỏi thường gặp" (FAQ entries written by Moderators, opened in place). What is shown lives in the URL,
     see assets/js/lib/qa-state.js (?q=&topics=&status=&sort=&page= or ?tab=faq&q=&topic=&page= / ?tab=faq&id=). -->
<main class="page blogpage qapage" id="qa">
    <div class="blog-head">
        <div>
            <h2>Hỏi-Đáp</h2>
            <p class="note" id="lead">Hỏi điều bạn chưa rõ, các senpai đã trải qua sẽ trả lời. Tìm trước, biết đâu đã có lời giải.</p>
        </div>
        <div class="row">
            <a class="btn pri" id="ask" href="#"><span class="ic" aria-hidden="true">contact_support</span>Đặt câu hỏi</a>
        </div>
    </div>

    <nav class="qa-tabs" id="tabs" aria-label="Mục trong Hỏi-Đáp">
        <a href="/qa" data-tab="community" aria-current="page"><span class="ic" aria-hidden="true">forum</span>Cộng đồng hỏi</a>
        <a href="/qa?tab=faq" data-tab="faq"><span class="ic" aria-hidden="true">quiz</span>Câu hỏi thường gặp</a>
    </nav>

    <form class="blog-search" id="search" role="search">
        <span class="ic" aria-hidden="true">search</span>
        <label class="sr-only" for="q" id="q-label">Tìm câu hỏi</label>
        <input id="q" name="q" type="search" maxlength="100" autocomplete="off"
               placeholder="Tìm câu hỏi theo nội dung hoặc địa điểm">
        <span class="note count" id="q-count" aria-live="polite"></span>
    </form>

    <div class="blog-filters" id="filters">
        <div class="seg" role="group" aria-label="Trạng thái câu hỏi" data-group="status">
            <button type="button" data-value="ALL">Tất cả</button>
            <button type="button" data-value="UNANSWERED">Chưa ai trả lời</button>
            <button type="button" data-value="UNSOLVED">Chưa giải quyết</button>
            <button type="button" data-value="SOLVED">Đã giải quyết</button>
        </div>
        <details class="dd" id="topic-dd">
            <summary class="btn sm"><span class="ic" aria-hidden="true">sell</span><span id="topic-label">Chủ đề</span><span class="ic" aria-hidden="true">expand_more</span></summary>
            <fieldset class="dd-panel" id="topic-list"><legend class="sr-only">Chọn chủ đề</legend></fieldset>
        </details>
        <span class="grow"></span>
        <div class="seg" role="group" aria-label="Sắp xếp" data-group="sort">
            <button type="button" data-value="NEWEST">Mới nhất</button>
            <button type="button" data-value="LIKES">Nhiều thích</button>
            <button type="button" data-value="ANSWERS">Nhiều trả lời</button>
        </div>
    </div>
    <div class="row chips" id="chips" hidden></div>
    <div class="qa-faq-topics" id="faq-topics" role="group" aria-label="Chủ đề câu hỏi thường gặp" hidden></div>

    <div class="blog-layout">
        <section class="blog-main" aria-labelledby="list-title">
            <h3 class="sr-only" id="list-title">Danh sách câu hỏi</h3>
            <p class="note" id="summary" aria-live="polite"></p>
            <section class="card qa-faq-box" id="faq-hits" aria-labelledby="faq-hits-title" hidden></section>
            <div class="post-list" id="list" aria-live="polite"></div>
            <nav class="pager" id="pager" aria-label="Phân trang" hidden></nav>
        </section>
        <aside class="blog-side" id="side" aria-label="Thống kê hỏi đáp"></aside>
    </div>
</main>
<script type="module" src="/assets/js/pages/qa.js"></script>
</body>
</html>
