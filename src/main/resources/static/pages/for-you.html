<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dành cho bạn – Senpai ơi</title>
    <link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#C2456E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/site.css">
    <link rel="stylesheet" href="/assets/css/blog.css">
    <link rel="stylesheet" href="/assets/css/for-you.css">
</head>
<body class="app">
<!-- "Dành cho bạn" ("Xem tất cả" on the member Home): every post of the personal feed, ranked like the Home's five,
     10 at a time; the search box keeps the posts holding a text, the scope buttons only the posts that matched one
     reason (area, stage, interests). -->
<main class="page narrow foryoupage" id="for-you">
    <div>
        <a class="link" href="/"><span class="ic" aria-hidden="true">chevron_left</span>Trang chủ</a>
        <h2>Dành cho bạn</h2>
    </div>
    <form class="site-search" id="search" role="search">
        <span class="ic" aria-hidden="true">search</span>
        <label class="sr-only" for="q">Tìm trong bài dành cho bạn</label>
        <input id="q" name="q" type="search" maxlength="100" autocomplete="off" enterkeyhint="search"
               placeholder="Tìm trong bài dành cho bạn">
        <span class="note count" id="q-count" aria-live="polite"></span>
    </form>
    <p class="note" id="summary" aria-live="polite">Đang tải…</p>
    <div class="fy-basis" id="basis" hidden></div>
    <div class="seg" id="scopes" role="group" aria-label="Lọc theo lý do gợi ý" hidden></div>
    <div class="fy-list" id="list"></div>
    <p class="alert error" id="failure" role="alert" hidden></p>
    <p><button class="btn sm" type="button" id="more" hidden>Xem thêm bài viết</button></p>
</main>
<script type="module" src="/assets/js/pages/for-you.js"></script>
</body>
</html>
