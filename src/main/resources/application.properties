spring.application.name=vietnamese-student-assistance
server.port=8080
# Behind a proxy or tunnel (nginx, Cloudflare, an SSH tunnel on this PC): trust its X-Forwarded-* headers when it sits
# on this machine or the local network, so the server knows the page is https (Secure cookies, https redirects,
# the visitor's address for the sign-up limits). Requests straight to the server are not affected.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
# Members stay signed in on their phone: a chat notification tapped hours later opens the conversation, not the
# sign-in page. The session lasts 14 days without activity and its cookie survives closing the browser ("cần chốt").
# "Đăng xuất" ends it at once; locked or deleted accounts are signed out on their next request (SessionUserRefreshFilter).
server.servlet.session.timeout=${SESSION_TIMEOUT:14d}
server.servlet.session.cookie.max-age=${SESSION_TIMEOUT:14d}
# Pages, scripts, styles and API answers are sent gzip-compressed (map.js, messages.js and the CSS get several times
# smaller on a phone's mobile data). Photos, videos and the live stream (text/event-stream) are not in the list.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml,application/manifest+json
server.compression.min-response-size=1024
# Pages, scripts and styles in static/ have no version in their name: the browser keeps them but asks every time
# whether they changed ("no-cache" + an ETag of the file's bytes, answered 304 Not Modified), so a new deploy shows at
# once and an unchanged file is not downloaded again. Without this Spring Security sends "no-store" and every page load
# downloads every file again. API answers keep "no-store"; /media sets its own header.
spring.web.resources.cache.cachecontrol.no-cache=true
# No Last-Modified (common/web/StaticResourceEtags): the server's jar dates every file 1980-02-01 on every deploy, so
# "changed since <date>?" was always answered 304 and browsers and Cloudflare kept the old files after a deploy.
spring.web.resources.cache.use-last-modified=false

# Loads application-local.properties (git-ignored) unless another profile is chosen
spring.profiles.default=local

# MySQL. Values come from environment variables or application-local.properties.
# createDatabaseIfNotExist creates the "asvsj" database on first run.
# forceConnectionTimeZoneToSession puts the MySQL session on UTC too, so DEFAULT CURRENT_TIMESTAMP columns
# (e.g. users.created_at) are written in UTC like everything the app writes, whatever the PC's time zone.
spring.datasource.url=jdbc:mysql://103.140.249.78:3306/asvsj?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=REQUIRED
spring.datasource.username=root
spring.datasource.password=ducthang564

# Tables are created and changed only by Flyway (src/main/resources/db/migration).
# Hibernate must never alter them. Switch to "validate" once all entities match the schema.
spring.flyway.enabled=false
# Migrations are written on several branches at once (this feature's V9 while a teammate's V7/V8 are not merged yet):
# a database that already ran a higher version then still applies the lower ones instead of refusing to start.
spring.flyway.out-of-order=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Address of the site as users open it, for links in emails ("Đặt lại mật khẩu"). Set APP_PUBLIC_URL on the server;
# never taken from the request's Host header (a forged header would send reset links to another site).
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# Uploads (photos and videos of posts). Photos are re-encoded to JPG ≤ 1600 px; video ≤ 30 s.
# max-request-size = 5 photos × 20 MB + 1 video × 50 MB, with some room for the text part.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=160MB
# Where media files are kept: "local" = the folder below, "r2" = a private Cloudflare R2 bucket (feature/media,
# R2MediaStorage). Either way they are served at /media/** after the access check. Tests always use "local".
app.media.storage=${MEDIA_STORAGE:local}
# Media files are kept in this folder while app.media.storage=local. Git-ignored.
app.media.local-dir=${MEDIA_DIR:uploads}
# Cloudflare R2 (app.media.storage=r2): account id from the dashboard, a bucket without public access and an R2 API
# token with "Object Read & Write" on that bucket only. Keep the keys out of Git (env or application-local.properties).
# import-from: a media folder used before, copied once into the bucket at the start (files already there are skipped).
app.media.r2.account-id=${R2_ACCOUNT_ID:}
app.media.r2.bucket=${R2_BUCKET:}
app.media.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.media.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.media.r2.import-from=${R2_IMPORT_FROM:}
app.media.public-base-url=/media/
app.media.video-max-mb=50

# Automatic photo scan (OpenAI Moderation, free). Without a key, photos are not really checked and
# app.moderation.dev-result decides (PASS, or FLAG to try the rejected flow).
app.moderation.openai.api-key=${OPENAI_API_KEY:}
app.moderation.dev-result=PASS
# Reading the text in photos and videos and the words spoken in videos (Gemini Flash-Lite, free tier of Google AI
# Studio: create a key at https://aistudio.google.com/apikey, no card needed). The text then goes through the banned
# keywords and the link rule. Without a key this step is skipped: photos are only checked by the photo scan above and
# videos are not checked. On the free tier Google may use what is sent to improve its products.
# requests-per-minute: for the whole server, kept below the free-tier limit, which Google does not publish: check
# your project's real limits in AI Studio (Rate limit) and adjust.
# model: the reader is written for the Flash-Lite family (3.x); another family may refuse its request settings, and a
# model that thinks more by default can use up maxOutputTokens before it answers (then every reading is an error).
app.moderation.gemini.api-key=${GEMINI_API_KEY:}
app.moderation.gemini.model=gemini-3.5-flash-lite
app.moderation.gemini.base-url=https://generativelanguage.googleapis.com
app.moderation.gemini.requests-per-minute=10
# Without a Gemini key: empty = the step is skipped (as above); a text = every photo and video "contains" this text,
# to try the keyword/link rejection locally (e.g. fb88)
app.moderation.dev-media-text=

# "Địa điểm liên quan" also searches OpenStreetMap (Photon search, Nominatim lookup: free, no key, see feature/place).
# enabled=false shows ASVSJ places only; dev-fake=true shows a few made-up places instead (works offline).
app.places.osm.enabled=${PLACES_OSM_ENABLED:true}
app.places.dev-fake=${PLACES_DEV_FAKE:false}
# Countries the map search covers (two-letter codes; empty = the whole world)
app.places.regions=${PLACES_REGIONS:jp,vn}
# Nominatim's usage policy asks every app to name itself in the User-Agent
app.places.osm.user-agent=${PLACES_OSM_USER_AGENT:SenpaiOi/1.0 (ASVSJ, FPT University SEP490 project)}

# Four scheduler threads: the three media-scan retry jobs (posts, place reviews, event reviews) may each wait on
# Gemini at the same time, and the featured-post snapshot and the daily clean-ups must not wait behind them
spring.task.scheduling.pool.size=4

# SMTP (only used when spring.mail.host is set, see the .example file): give up after 5 s to connect, read or write,
# so a mail server that does not answer cannot keep a sign-up request waiting for minutes
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# "Tin nhắn" new-message notifications (feature/chat/notify): an e-mail when messages stay unread, and Web Push on the
# browsers where the member turned it on. Neither ever contains the message text. The link in the e-mails uses
# app.public-url (above, env APP_PUBLIC_URL).
# Web Push (VAPID, RFC 8292): "sub" tells the push services whom to contact (an https URL or mailto: of the team).
# The key pair is made on first use and kept in the web_push_keys table; never change that row, or every browser has to
# subscribe again.
app.push.subject=${PUSH_SUBJECT:https://github.com/baonv228/Assistance-System-for-Vietnamese-Students-in-Japan}
# The only push services the server calls (https, default port; "*." = any name under it). The endpoint comes from the
# browser, so any other address is refused (otherwise a member could make the server call any URL).
app.push.allowed-hosts=fcm.googleapis.com,*.push.services.mozilla.com,*.notify.windows.com,web.push.apple.com,*.push.apple.com
# At most one push per member and conversation in this many seconds ("cần chốt")
app.chat.notify.push-spacing-seconds=30
# E-mail: checked every 5 minutes; a message must have waited unread this long; one e-mail per conversation at most
# every this many hours ("cần chốt")
app.chat.notify.email-interval-ms=300000
app.chat.notify.email-initial-delay-ms=60000
app.chat.notify.email-delay-minutes=10
app.chat.notify.email-spacing-hours=6

# "Nhiệm vụ hằng ngày" of "Nhật ngữ" (feature/quest) and "xu" (feature/coin). Xu never count toward the rank: only the
# Member's own "Đổi" turns them into rank points, app.coins.rate xu a point, at most app.coins.month-cap points a Japan
# month. Map keys in brackets: without them Spring drops the "_" of FLASH_REVIEW.
app.quests.zone=Asia/Tokyo
app.quests.fixed=FLASH_REVIEW
app.quests.rotating=LEARN_NEW,REVIEW_LEARNING,TOPIC,PHRASE_OF_DAY
app.quests.rotating-per-day=2
app.quests.target[FLASH_REVIEW]=10
app.quests.target[LEARN_NEW]=3
app.quests.target[REVIEW_LEARNING]=5
app.quests.target[TOPIC]=5
app.quests.target[PHRASE_OF_DAY]=1
app.quests.coins-per-quest=10
app.quests.bonus-coins=20
app.quests.daily-cap=50
app.quests.streak-every=7
app.quests.streak-coins=50
# Two flash card answers closer than this: the second is kept as a mark but not counted for the quests
app.quests.min-answer-interval-ms=1500
app.quests.events-per-minute=30
# Stage → learning topic ids for the quest TOPIC, first one with enough entries wins (ids of dev/sample-data.sql; check
# them on the shared database: a topic with fewer entries than the TOPIC target is never chosen)
app.quests.stage-topics[PRE]=paper,ask,train
app.quests.stage-topics[ARR]=pay,train,paper,health
app.quests.stage-topics[LEAVE]=paper,pay
app.quests.stage-topics[HOME]=ask,order
# Quests that follow what the Member is interested in (QuestInterests): blog topics chosen in "Chủ đề quan tâm"
# (chosen-weight), and in the last `days` days likes, saves, comments, own posts / questions (blog topics) and saved,
# worked-on or done guides (guide topics). A learnt topic needs min-weight; the `top` strongest are followed, and at least
# min-per-day of the rotating quests follow one when the library allows it.
app.quests.interest.days=90
app.quests.interest.min-weight=2
app.quests.interest.chosen-weight=4
app.quests.interest.top=3
app.quests.interest.min-per-day=1
# Topic → "Luyện tập" groups, preferred first: topic:<learning_topics.id> or category:<place_categories.id> (ids of
# dev/sample-data.sql and V1; check the learning topics on the shared database). Blog topics are keyed by their name
# without accents, spaces or case (VietnameseText.squash: "Thủ tục giấy tờ" → thutucgiayto); guide topics by their code.
# Not mapped (the library has no entries for them yet): Kinh nghiệm, Cảnh báo lừa đảo, Việc làm thêm, Khác; WORK, OTHER.
app.quests.interest.blog-topics[thutucgiayto]=topic:paper,category:ward
app.quests.interest.blog-topics[visavacutru]=topic:paper,category:ward
app.quests.interest.blog-topics[nhao]=category:housing
app.quests.interest.blog-topics[anuong]=topic:order,category:food
app.quests.interest.blog-topics[dilai]=topic:train,category:station
app.quests.interest.blog-topics[hoctiengnhat]=topic:ask,category:school
app.quests.interest.blog-topics[yte]=topic:health,category:hospital,category:pharmacy
app.quests.interest.blog-topics[muasam]=topic:shop,category:super,category:konbini
app.quests.interest.blog-topics[nganhangvatien]=topic:pay,category:bank
app.quests.interest.blog-topics[saukhivenuoc]=topic:paper
app.quests.interest.guide-topics[LIVING]=topic:shop,topic:pay,category:konbini,category:laundry
app.quests.interest.guide-topics[PROCEDURES]=topic:paper,category:ward
app.quests.interest.guide-topics[STUDY]=category:school,topic:ask
app.quests.interest.guide-topics[HOUSING]=category:housing
app.quests.interest.guide-topics[HEALTH]=topic:health,category:hospital,category:pharmacy
app.quests.interest.guide-topics[TRANSPORT]=topic:train,category:station
app.coins.rate=50
app.coins.month-cap=10
# Test-only API /api/dev/quests/** and sample marks: also needs spring.datasource.url on this machine (localhost).
# Never set on the server.
app.quests.dev-api.enabled=${QUESTS_DEV_API:false}
