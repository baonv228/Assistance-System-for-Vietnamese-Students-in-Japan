spring.application.name=vietnamese-student-assistance
server.port=8080

# Loads application-local.properties (git-ignored) unless another profile is chosen
spring.profiles.default=local

# MySQL. Values come from environment variables or application-local.properties.
# createDatabaseIfNotExist creates the "asvsj" database on first run.
# forceConnectionTimeZoneToSession puts the MySQL session on UTC too, so DEFAULT CURRENT_TIMESTAMP columns
# (e.g. users.created_at) are written in UTC like everything the app writes, whatever the PC's time zone.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/asvsj?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ducthang564}

# Tables are created and changed only by Flyway (src/main/resources/db/migration).
# Hibernate must never alter them. Switch to "validate" once all entities match the schema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Address of the site as users open it, for links in emails ("Đặt lại mật khẩu"). Set APP_PUBLIC_URL on the server;
# never taken from the request's Host header (a forged header would send reset links to another site).
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# Uploads (photos and videos of posts). Photos are re-encoded to JPG ≤ 1600 px; video ≤ 30 s.
# max-request-size = 5 photos × 20 MB + 1 video × 50 MB, with some room for the text part.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=160MB
# Media files are kept in this folder and served at /media/** (see feature/media). Git-ignored.
app.media.local-dir=${MEDIA_DIR:uploads}
app.media.public-base-url=/media/
app.media.video-max-mb=50

# Automatic photo scan (OpenAI Moderation, free). Without a key, photos are not really checked and
# app.moderation.dev-result decides (PASS, or FLAG to try the rejected flow).
app.moderation.openai.api-key=${OPENAI_API_KEY:}
app.moderation.dev-result=PASS

# "Địa điểm liên quan" also searches OpenStreetMap (Photon search, Nominatim lookup: free, no key, see feature/place).
# enabled=false shows ASVSJ places only; dev-fake=true shows a few made-up places instead (works offline).
app.places.osm.enabled=${PLACES_OSM_ENABLED:true}
app.places.dev-fake=${PLACES_DEV_FAKE:false}
# Countries the map search covers (two-letter codes; empty = the whole world)
app.places.regions=${PLACES_REGIONS:jp,vn}
# Nominatim's usage policy asks every app to name itself in the User-Agent
app.places.osm.user-agent=${PLACES_OSM_USER_AGENT:SenpaiOi/1.0 (ASVSJ, FPT University SEP490 project)}

# Two scheduler threads, so a slow photo-scan retry never delays the featured-post snapshot
spring.task.scheduling.pool.size=2

# SMTP (only used when spring.mail.host is set, see the .example file): give up after 5 s to connect, read or write,
# so a mail server that does not answer cannot keep a sign-up request waiting for minutes
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
