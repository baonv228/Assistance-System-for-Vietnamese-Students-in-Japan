spring.application.name=vietnamese-student-assistance
server.port=8080

# Loads application-local.properties (git-ignored) unless another profile is chosen
spring.profiles.default=local

# MySQL. Values come from environment variables or application-local.properties.
# createDatabaseIfNotExist creates the "asvsj" database on first run.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/asvsj?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ducthang564}

# Tables are created and changed only by Flyway (src/main/resources/db/migration).
# Hibernate must never alter them. Switch to "validate" once all entities match the schema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
